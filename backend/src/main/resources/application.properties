# Secrets (DB password, JWT secret, Gemini key, Facebook secret) live in
# application-secrets.properties, which is gitignored and NOT committed.
# See application-secrets.properties.example for the template.
spring.config.import=optional:classpath:application-secrets.properties

# Supabase PostgreSQL
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres?sslmode=require&preferQueryMode=simple&prepareThreshold=0
spring.datasource.username=postgres.hlxpwkbyledjgfoyjzcf
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Gemini
