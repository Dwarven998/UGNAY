# Secrets and environment-specific config
spring.config.import=optional:file:.env[.properties]

# Supabase PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate

# Page-scoping columns (posts.fb_page_id, media_folders.fb_page_id) are added by an idempotent script that
# runs BEFORE Hibernate validates the schema (every statement in it is idempotent).
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/2026-09-21_facebook_page_scoped_data.sql
spring.sql.init.continue-on-error=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Lazy associations touched while building a list are loaded for up to 50 rows per query instead of one query
# per row, which matters because every query is a round trip to the remote Supabase database.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent
# Raced alongside the model above: whichever answers first is used, so one overloaded model ("503 high demand")
# no longer makes caption generation fail.
gemini.api.fallback-models=gemini-3.1-flash-lite,gemini-3.1-flash-lite-preview,gemini-flash-lite-latest

# Facebook
facebook.api.url=https://graph.facebook.com/v20.0
facebook.app.id=${FACEBOOK_APP_ID}
facebook.app.secret=${FACEBOOK_APP_SECRET}
facebook.oauth.authorize-url=https://www.facebook.com/v20.0/dialog/oauth
facebook.oauth.token-url=https://graph.facebook.com/v20.0/oauth/access_token
facebook.oauth.redirect-uri=${FACEBOOK_OAUTH_REDIRECT_URI}

# App
app.frontend.url=${FRONTEND_URL}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Supabase Storage
supabase.storage.url=${VITE_SUPABASE_URL:}
supabase.storage.key=${VITE_SUPABASE_ANON_KEY:}
supabase.storage.bucket=${VITE_SUPABASE_BUCKET:media}

# Analytics
analytics.engagement-sync.interval-ms=180000


# Connection pool: the Supabase pooler is remote and opening a fresh connection takes several seconds,
# so keep a few connections warm instead of letting idle ones be dropped and re-opened mid-request.
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=1500000
