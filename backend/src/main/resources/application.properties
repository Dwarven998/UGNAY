# Secrets and environment-specific config
spring.config.import=optional:file:.env[.properties]

# Supabase PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent

# Facebook
facebook.api.url=https://graph.facebook.com/v20.0
facebook.app.id=${FACEBOOK_APP_ID}
facebook.app.secret=${FACEBOOK_APP_SECRET}
facebook.oauth.authorize-url=https://www.facebook.com/v20.0/dialog/oauth
facebook.oauth.token-url=https://graph.facebook.com/v20.0/oauth/access_token
facebook.oauth.redirect-uri=${FACEBOOK_OAUTH_REDIRECT_URI}

# App
app.frontend.url=${FRONTEND_URL}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Supabase Storage
supabase.storage.url=${VITE_SUPABASE_URL:}
supabase.storage.key=${VITE_SUPABASE_ANON_KEY:}
supabase.storage.bucket=${VITE_SUPABASE_BUCKET:media}

# Analytics
analytics.engagement-sync.interval-ms=180000

# n8n Facebook Publishing
n8n.facebook.publish.webhook-url=${N8N_FACEBOOK_PUBLISH_WEBHOOK_URL}
n8n.facebook.publish.webhook-secret=${N8N_FACEBOOK_PUBLISH_WEBHOOK_SECRET:}