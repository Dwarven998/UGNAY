# Secrets and environment-specific config (DB connection, JWT secret, Gemini key,
# Facebook app id/secret/redirect, frontend/CORS URLs) live in backend/.env, which
# is gitignored and NOT committed. See backend/.env.example for the template.
spring.config.import=optional:file:.env[.properties]

# Supabase PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent

# Facebook
facebook.api.url=https://graph.facebook.com/v20.0
facebook.app.id=${FACEBOOK_APP_ID}
facebook.app.secret=${FACEBOOK_APP_SECRET}
facebook.oauth.authorize-url=https://www.facebook.com/v20.0/dialog/oauth
facebook.oauth.token-url=https://graph.facebook.com/v20.0/oauth/access_token
facebook.oauth.redirect-uri=${FACEBOOK_OAUTH_REDIRECT_URI}
app.frontend.url=${FRONTEND_URL}
# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Supabase Storage (server-side cleanup: deletes a media asset's file once its post is published)
supabase.storage.url=${VITE_SUPABASE_URL:}
supabase.storage.key=${VITE_SUPABASE_ANON_KEY:}
supabase.storage.bucket=${VITE_SUPABASE_BUCKET:media}
